[project]
name = "chatgpt-to-openai-api"
version = "1.0.0"
description = "Expose ChatGPT web accounts as a local OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "curl_cffi>=0.7",
    "pillow",
]

[tool.uv]
package = false
required-version = ">=0.12.9"
[dependency-groups]
dev = ["ty>=0.0.78", "ruff>=0.16.6", "pytest>=8.0", "typing-extensions>=4.0"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.ruff]
target-version = "py311"
preview = true
[tool.ruff.lint]
select = ["ALL"]
# incorrect-blank-line-before-class / multi-line-summary-second-line conflict
# with the enabled D211/D212 pair (ruff ignores one side itself);
# missing-trailing-comma conflicts with the formatter (formatter owns trailing commas).
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]
preview = true
[tool.ruff.format]
preview = true
[tool.ruff.lint.per-file-ignores]
# assert (no asserts) is mutually exclusive with PT009 (require bare asserts in
# tests) under select ALL; the tools themselves demand one side be disabled.
"tests/**" = ["assert"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
